# Services for local development: Postgres + Mailpit (a fake mail server).
#   Start:  pnpm db:up      (starts both, waits until they're ready)
#   Stop:   pnpm db:down    (your data is kept in the "pgdata" volume)
#   Wipe:   docker compose down -v   (deletes the volume = ALL local data)
#
# The password here is for local development only. Real deployments get their
# own credentials (AWS Secrets Manager, or the desktop app's setup wizard).
name: sustainability-hub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: sustainability_hub
    ports:
      # 127.0.0.1 = reachable from this PC only, not from other devices on the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d sustainability_hub"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the API sends in development (verification links,
  # password resets) so nothing goes to real inboxes.
  # Inbox in the browser: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP: the API sends here
      - "127.0.0.1:8025:8025" # web inbox
    environment:
      MP_MAX_MESSAGES: 500 # keep only the newest 500 emails

volumes:
  pgdata:

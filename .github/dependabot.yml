# Dependabot opens pull requests to update dependencies. Each one runs CI, so a
# green PR is safe to merge. Grouped and weekly, so it's a few PRs a week, not dozens.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm workspaces (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only versions released at least a week ago (a broken or malicious
    # release is usually caught and pulled within days)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope # "chore(deps): ..." (Conventional Commits)
    groups:
      # All minor and patch updates in one PR; major versions get their own
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to ~6.0 until typescript-eslint supports newer TypeScript (AGENTS.md)
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

# Runs on every pull request (and on main after a merge). A PR should only be
# merged when all three jobs are green (Render deploys main only then too).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository
permissions:
  contents: read

# A new push to the same PR cancels the run that is still going for the old commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version from "packageManager" in package.json, Node from .node-version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # If someone changed packages/db/src/schema but forgot `pnpm db:generate`,
      # generating here writes a new migration file and the check fails.
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::The database schema changed without a migration. Run 'pnpm db:generate' and commit the new file in packages/db/migrations."
            git status --porcelain packages/db/migrations
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same Postgres as docker-compose.yml. The API tests create their own
    # database in it (sustainability_hub_test) and load every migration and the
    # factor library, exactly like a fresh install.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: sustainability_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d sustainability_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://hub:hub@localhost:5432/sustainability_hub_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image Render deploys, built and started exactly like in production
    # (NODE_ENV=production, the app served by the API) on an empty database.
    # If it doesn't build, start, migrate or serve the app, this job fails, and
    # Render (autoDeployTrigger: checksPass) never deploys that commit.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: sustainability_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d sustainability_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag sustainability-hub:ci .

      - name: Start it with production settings
        # Throwaway values for this test only. --network host: the container
        # reaches the Postgres service at 127.0.0.1:5432.
        run: |
          docker run --detach --name hub --network host \
            --env PORT=3000 \
            --env DATABASE_URL=postgres://hub:hub@127.0.0.1:5432/sustainability_hub \
            --env APP_URL=http://127.0.0.1:3000 \
            --env BETTER_AUTH_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
            --env SMTP_URL=smtp://127.0.0.1:1025 \
            --env CHECK_BREACHED_PASSWORDS=false \
            sustainability-hub:ci

      - name: Smoke test
        run: node scripts/smoke-test.mjs http://127.0.0.1:3000 --wait 120

      - name: Server log
        if: always()
        run: docker logs hub
